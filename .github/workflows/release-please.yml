name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write  # dispatch docs-release.yml

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # A release created with GITHUB_TOKEN starts no workflow, and
      # workflow_dispatch is the documented exception.
      - name: Build the documentation of the new tag
        # The action emits the string "false", which is itself truthy.
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: gh workflow run docs-release.yml --ref main -f version="$VERSION"
        env:
          VERSION: ${{ steps.release.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}  # no checkout in this job
