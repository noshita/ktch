name: Docs

# Released versions come from their stored builds (docs-release.yml).

on:
  push:
    branches: ["main"]
    paths:
      - "doc/**"
      - "ktch/**"
      - "scripts/assemble_site.py"
      - "scripts/gen_redirects.py"
      - "scripts/stamp_sitemap_lastmod.py"
      - ".github/workflows/documentation.yml"
      - ".github/workflows/docs-build.yml"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions: {}

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-dev:
    # Skip the release merge, whose version has no stored build yet.
    # docs-release.yml dispatches this workflow once it has.
    if: ${{ github.event_name != 'push' ||
            !contains(github.event.head_commit.message, 'release-please--branches--main') }}
    permissions:
      contents: read
    uses: ./.github/workflows/docs-build.yml
    with:
      version: dev
      ref: ${{ github.sha }}

  assemble:
    needs: build-dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DEV_ARTIFACT: ${{ needs.build-dev.outputs.artifact }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The stable sitemap is dated from git history.
          fetch-depth: 0
          persist-credentials: false

      - name: Download the dev build
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.DEV_ARTIFACT }}
          path: ${{ runner.temp }}/dev

      - name: Download the released versions' builds
        run: |
          mkdir "$RUNNER_TEMP/assets"
          jq -r '.[] | select(.version != "dev") | .version' doc/_static/versions.json |
            while read -r version; do
              gh release download "v$version" --pattern "ktch-docs-html-$version.tar.gz" \
                --dir "$RUNNER_TEMP/assets"
            done

      - name: Assemble the site
        run: |
          python3 scripts/assemble_site.py --dev "$RUNNER_TEMP/dev/$DEV_ARTIFACT.tar.gz" \
            --assets-dir "$RUNNER_TEMP/assets" --out "$RUNNER_TEMP/site"
          ls -la "$RUNNER_TEMP/site"

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
