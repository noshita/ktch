name: Codecov
on:
  push:
    branches: ["main"]
    paths:
      [
        "ktch/**",
        .github/workflows/test-codecov.yml,
        .github/actions/uv-python/action.yml,
        pyproject.toml,
        uv.lock,
      ]
  schedule:
    # Mondays, 15:00 JST (06:00 UTC).
    - cron: "0 6 * * 1"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Python versions come from pyproject.toml: requires-python and the
  # classifiers.
  versions:
    runs-on: ubuntu-latest
    outputs:
      supported: ${{ steps.read.outputs.supported }}
      floor: ${{ steps.read.outputs.floor }}
      latest: ${{ steps.read.outputs.latest }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import pathlib
          import re

          text = pathlib.Path("pyproject.toml").read_text()
          floor = re.search(r'requires-python\s*=\s*">=(\d+\.\d+)"', text).group(1)
          supported = sorted(
              re.findall(r'"Programming Language :: Python :: (\d+\.\d+)"', text),
              key=lambda v: tuple(int(part) for part in v.split(".")),
          )
          if supported[0] != floor:
              raise SystemExit(
                  f"requires-python says {floor}, lowest classifier says {supported[0]}"
              )
          print("floor=" + floor)
          print("latest=" + supported[-1])
          print("supported=" + json.dumps(supported))
          PY

  test:
    if: github.event_name != 'schedule'
    needs: versions
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ${{ fromJSON(needs.versions.outputs.supported) }}
        include:
          - os: macOS-latest
            python-version: ${{ needs.versions.outputs.latest }}
          - os: windows-latest
            python-version: ${{ needs.versions.outputs.latest }}
          - os: windows-latest
            python-version: ${{ needs.versions.outputs.floor }}
    env:
      OS: ${{ matrix.os }}
      PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/uv-python
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --frozen --no-default-groups --group test --all-extras
      - name: Test with pytest
        run: uv run --no-sync pytest --benchmark-skip --cov=./ --cov-report=xml
      - name: Upload coverage reports to Codecov
        if: matrix.os == 'ubuntu-latest' && github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@v7
        with:
          env_vars: OS,PYTHON
          fail_ci_if_error: true
          files: ./coverage.xml
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

  # Resolves the floors declared in pyproject.toml instead of the lockfile.
  floors:
    if: github.event_name != 'schedule'
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/uv-python
        with:
          python-version: ${{ needs.versions.outputs.floor }}
      - name: Install dependencies at the declared floors
        run: |
          uv lock --resolution lowest-direct
          uv sync --frozen --no-default-groups --group test --all-extras
      - name: Test with pytest
        run: uv run --no-sync pytest --benchmark-skip

  # A core install must not import the optional dependencies.
  core:
    if: github.event_name != 'schedule'
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/uv-python
        with:
          python-version: ${{ needs.versions.outputs.latest }}
      - name: Install without the extras
        run: uv sync --frozen --no-default-groups --group test
      - name: Import every subpackage
        run: |
          uv run --no-sync python - <<'PY'
          import sys

          import ktch
          import ktch.coiling
          import ktch.harmonic
          import ktch.io
          import ktch.landmark

          leaked = [n for n in ("matplotlib", "plotly", "seaborn") if n in sys.modules]
          assert not leaked, f"optional dependencies imported unconditionally: {leaked}"
          print(ktch.__version__)
          PY

  # Resolves the newest compatible releases. Reports, does not block.
  latest:
    if: github.event_name != 'push'
    needs: versions
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/uv-python
        with:
          python-version: ${{ needs.versions.outputs.latest }}
      - name: Install the newest compatible releases
        run: |
          uv lock --upgrade
          uv sync --frozen --no-default-groups --group test --all-extras
      - name: Test with pytest
        run: uv run --no-sync pytest --benchmark-skip

  # The Colab runtimes: the current one and every past one a notebook can pin.
  colab-runtimes:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      runtimes: ${{ steps.list.outputs.runtimes }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: List the runtimes
        id: list
        run: |
          uv run scripts/colab_runtimes.py list
          runtimes=$(uv run scripts/colab_runtimes.py list --json | jq -c '[.[] | {runtime, python}]')
          echo "runtimes=$runtimes" >> "$GITHUB_OUTPUT"

  # Installs ktch on top of what each Colab runtime ships. Reports, does not
  # block. The job fails when the install would change a package Colab ships.
  colab:
    needs: colab-runtimes
    name: colab (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.colab-runtimes.outputs.runtimes) }}
    env:
      RUNTIME: ${{ matrix.runtime }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/uv-python
        with:
          python-version: ${{ matrix.python }}
      - name: Check that installing ktch changes no Colab package
        id: check
        continue-on-error: true
        run: uv run scripts/colab_runtimes.py check "$RUNTIME" --preinstall colab-preinstalled.txt
      - name: Install Colab's versions, then ktch on top of them
        run: |
          uv pip install --system -r colab-preinstalled.txt
          uv pip install --system ".[data,plot]" "pytest>=8.3" "pytest-benchmark>=5.1.0"
      - name: Test with pytest
        run: pytest --benchmark-skip
      - name: Fail if the install changed a Colab package
        if: steps.check.outcome == 'failure'
        run: exit 1
