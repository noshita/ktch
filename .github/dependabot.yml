version: 2
updates:
  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows only, not the local composite actions.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    groups:
      # One pull request per action, covering every directory that uses it.
      actions:
        patterns: ["*"]
        group-by: dependency-name
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Security updates only.
    # A limit of 0 disables version-update PRs while still allowing
    # Dependabot security updates, which ignore this limit.
    open-pull-requests-limit: 0
