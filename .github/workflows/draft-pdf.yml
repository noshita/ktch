name: Draft PDF

on:
  push:
    paths:
      - "paper/**"
      - ".github/workflows/draft-pdf.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  paper:
    name: Paper draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build draft PDF
        # The Open Journals typesetting toolchain, i.e. the same one the JOSS
        # editorial bot runs for `@editorialbot generate pdf`.
        uses: openjournals/openjournals-draft-action@85a18372e48f551d8af9ddb7a747de685fbbb01c # master as of 2024-07-17
        with:
          journal: joss
          paper-path: paper/paper.md
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: paper
          path: paper/paper.pdf
